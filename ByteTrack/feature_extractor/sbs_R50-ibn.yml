## Specialized FastReID config for the appearance model used by the tracker.
## The tracking pipeline only performs inference, but FastReID still loads this
## config chain to reconstruct the network architecture before loading weights.
_BASE_: Base-SBS.yml

INPUT:
  ## Resize each detection crop to a fixed square size.
  SIZE_TRAIN: [256, 256]
  SIZE_TEST: [256, 256]

MODEL:
  BACKBONE:
    ## Backbone options kept from the original training run.
    WITH_IBN: True
    WITH_NL: True

SOLVER:
  ## These training hyperparameters are mostly historical here.
  OPT: SGD
  BASE_LR: 0.01
  ETA_MIN_LR: 7.7e-5

  IMS_PER_BATCH: 64
  MAX_EPOCH: 60
  WARMUP_ITERS: 3000
  FREEZE_ITERS: 3000

  CHECKPOINT_PERIOD: 10

DATASETS:
  NAMES: ("VeRi",)
  TESTS: ("VeRi",)

DATALOADER:
  SAMPLER_TRAIN: BalancedIdentitySampler

TEST:
  EVAL_PERIOD: 10
  IMS_PER_BATCH: 256

## Original training logs were written here.
OUTPUT_DIR: logs/veri/sbs_R50-ibn
