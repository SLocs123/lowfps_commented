[tool.poetry]
name = "trajectoryinit"
version = "0.1.0"
description = "Takes MOT tracks and a corresponding video to parameterise the scene trajectories and zones, to enhance motion prediction and tracking"
authors = ["SLocs123 <sl2726@bath.ac.uk>"]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"

# PyTorch CUDA stack
torch = { version = "2.9.1", source = "pytorch-gpu" }
torchvision = { version = "0.24.1", source = "pytorch-gpu" }
torchaudio = { version = "2.9.1", source = "pytorch-gpu" }

# Core scientific stack
numpy = ">=1.26,<3.0"
scipy = ">=1.11,<2.0"
pandas = ">=3.0.1,<4.0.0"
matplotlib = ">=3.10.8,<4.0.0"

# CV / imaging
opencv-python = ">=4.10,<5.0"
shapely = ">=2.0,<3.0"
# pillow = ">=10.0,<13.0"
# scikit-image = ">=0.26.0,<0.27.0"

# ML / tracking
scikit-learn = ">=1.3,<2.0"
ultralytics = ">=8.4.19,<9.0.0"
faiss-cpu = "^1.13.2"

# Config / utilities
pydantic = ">=2.7,<3.0"
pydantic-settings = ">=2.2,<3.0"
typing-extensions = ">=4.9,<5.0"
pyyaml = ">=6.0,<7.0"
yacs = ">=0.1.8,<1.0"
tabulate = ">=0.9,<1.0"
termcolor = ">=2.4,<3.0"
tqdm = ">=4.67.3,<5.0.0"

# Logging / acceleration
# tensorboard = ">=2.16,<3.0"
# accelerate = "^1.0.0"
# transformers = "^4.53.0"
# safetensors = "^0.4.0"

# Performance / compilation
numba = ">=0.64.0,<0.65.0"
ninja = ">=1.13.0,<2.0.0"
cython-bbox = ">=0.1.5,<0.2.0"


# MOT / tracking evaluation
lap = ">=0.5.13,<0.6.0"
motmetrics = ">=1.4.0,<2.0.0"
filterpy = ">=1.4.5,<2.0.0"

# Misc
h5py = ">=3.15.1,<4.0.0"
thop = ">=0.1.1.post2209072238,<0.2.0"

name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"